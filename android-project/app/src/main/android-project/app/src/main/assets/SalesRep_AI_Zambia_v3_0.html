<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SalesRep AI Zambia</title>
<style>
:root{--navy:#0F2A44;--navy2:#1B4A7A;--blue:#2878C8;--pale:#F1F5F9;--white:#fff;--dark:#1F3347;--muted:#64748B;--green:#16A34A;--red:#DC2626;--amber:#D97706;--teal:#0E9F8E;--line:#E2E8F0;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--pale);color:var(--dark);font-size:15px}
#app{display:flex;flex-direction:column;height:100%}
#hdr{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));box-shadow:0 2px 8px rgba(15,42,68,.25)}
#hdr b{font-size:18px;letter-spacing:.2px;display:block}
#hdr span{font-size:11px;opacity:.8}
#main{flex:1;overflow-y:auto;padding:12px 14px 24px;-webkit-overflow-scrolling:touch}
#nav{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 8px rgba(15,42,68,.06)}
#nav button{background:none;border:0;color:var(--muted);font-family:inherit;font-size:11px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button i{font-style:normal;font-size:19px}
#nav button.on{color:var(--blue);font-weight:700}
/* Splash */
#splash{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy),var(--navy2));display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:90;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
.logo{width:92px;height:92px;border-radius:26px;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
.sname{margin-top:18px;font-size:22px;font-weight:700;animation:rise .9s .3s both}
.stag{font-size:13px;opacity:.8;margin-top:4px;animation:rise .9s .5s both}
.bar{width:120px;height:4px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:26px;overflow:hidden}
.bar div{height:100%;width:0;background:#fff;animation:load 1.6s .2s ease-out forwards}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes rise{0%{transform:translateY(12px);opacity:0}100%{transform:none;opacity:1}}
@keyframes load{to{width:100%}}
/* Welcome and lock */
.welcome{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:10px 4px}
.welcome .hi{font-size:26px;font-weight:800;color:var(--navy)}
.welcome .dt{color:var(--muted);font-size:13px;margin-bottom:18px}
.glance{background:#fff;border-radius:18px;padding:6px 14px;box-shadow:0 2px 10px rgba(15,42,68,.07)}
.glance div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.glance div:last-child{border:0}
.glance b{color:var(--navy)}
.start{margin-top:22px;background:linear-gradient(135deg,var(--blue),var(--navy2));color:#fff;border:0;border-radius:16px;padding:17px;font-size:17px;font-weight:700;font-family:inherit;box-shadow:0 6px 16px rgba(40,120,200,.35)}
.lock{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dots{display:flex;gap:14px;margin:18px 0 26px}
.dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--navy)}
.dots span.f{background:var(--navy)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:76px;border-radius:50%;border:0;background:#fff;font-size:24px;color:var(--navy);box-shadow:0 2px 6px rgba(15,42,68,.1);font-family:inherit}
/* Common UI */
h2{color:var(--navy);font-size:21px;margin:2px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h3{color:var(--navy);font-size:15px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.4px}
p,.note{color:var(--muted);font-size:12.5px;margin:4px 0 8px;line-height:1.45}
.card{background:#fff;border-radius:16px;padding:13px;margin:9px 0;box-shadow:0 1px 4px rgba(15,42,68,.07)}
.card h4{margin:0 0 4px;color:var(--navy);font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.meta{font-size:12.5px;color:var(--dark);line-height:1.55;white-space:pre-line}
.low{color:var(--red)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;margin:6px 0;color:#fff;font-weight:700;font-size:14.5px;background:var(--blue);font-family:inherit}
.btn.small{display:inline-block;width:auto;padding:8px 11px;margin:4px 4px 0 0;font-size:12px;border-radius:10px}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.navy{background:var(--navy)}.btn.teal{background:var(--teal)}.btn.muted{background:#94A3B8}.btn.amber{background:var(--amber)}
.btn:active{opacity:.85}
input,select,textarea{width:100%;padding:11px 12px;margin:5px 0;border:1px solid #CBD5E1;border-radius:11px;font-size:15px;font-family:inherit;background:#fff;color:var(--dark)}
textarea{min-height:70px;resize:vertical}
label{font-size:12px;color:var(--muted);display:block;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fff;border-radius:16px;padding:13px 14px;box-shadow:0 1px 4px rgba(15,42,68,.07)}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:12px}
.hero b{font-size:19px;display:block}
.hero div{font-size:13px;opacity:.85;margin-top:3px}
.progress{height:10px;background:var(--line);border-radius:10px;overflow:hidden;margin:8px 0 4px}
.progress div{height:100%;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:10px}
.row{display:flex;gap:6px;align-items:center}
.row>*{flex:1}
.row>.fixed{flex:0 0 auto}
.tabs{display:flex;background:#E2E8F0;border-radius:12px;padding:4px;margin:6px 0 10px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-family:inherit;font-weight:600;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:#E6EEF6;color:var(--navy);font-weight:600}
.tag.red{background:#FEE2E2;color:var(--red)}.tag.green{background:#DCFCE7;color:var(--green)}.tag.amber{background:#FEF3C7;color:var(--amber)}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--line)}
.chart{display:flex;align-items:flex-end;gap:6px;height:130px;background:#fff;border-radius:16px;padding:12px;margin:8px 0;box-shadow:0 1px 4px rgba(15,42,68,.07)}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart .bar2{width:70%;background:linear-gradient(180deg,var(--blue),var(--navy2));border-radius:6px 6px 2px 2px;min-height:2px}
.chart small{font-size:9px;color:var(--muted);text-align:center;margin-top:3px;line-height:1.2}
.modal{position:fixed;inset:0;background:rgba(15,42,68,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .panel{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:85%;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal .content{overflow-y:auto;flex:1}
.pre{white-space:pre-wrap;font-size:13px;color:var(--dark);line-height:1.5;margin:6px 0}
audio{width:100%;margin-top:6px}
</style>
</head>
<body>
<div id="splash"><div class="logo">SR</div><div class="sname">SalesRep AI</div><div class="stag">Zambia • Personal Sales Assistant</div><div class="bar"><div></div></div></div>
<div id="app" style="display:none">
  <header id="hdr"><b>SalesRep AI Zambia</b><span>Personal Sales Assistant • v3.0</span></header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="modal" class="modal"></div>
<input type="file" id="photoIn" accept="image/*" style="display:none" onchange="onPhotoPicked(this)">
<input type="file" id="shopPhotoIn" accept="image/*" style="display:none" onchange="onShopPhoto(this)">
<input type="file" id="voiceIn" accept="audio/*" style="display:none" onchange="onVoice(this)">
<input type="file" id="restoreIn" accept=".json,application/json" style="display:none" onchange="restoreBackup(this)">

<script>
/* ============================================================
   SalesRep AI Zambia v3.0 - single HTML file for the HTML to APK builder.
   Data is stored in the app's local storage on this phone.
   Written with older-browser-friendly JavaScript (no ?? or ?. operators).
   ============================================================ */

var VERSION = "3.0";
var KEY = "salesrep_ai_zambia_v30";
var CUR = "K";
var TEMPLATES = ["Restock reminder", "Order confirmation", "Quotation", "Follow-up", "Payment reminder"];
var DEFAULT_ENDPOINT = "https://api.openai.com/v1/chat/completions";
var DEFAULT_MODEL = "gpt-4o-mini";
var REPORT_OUTCOMES = {
  "Follow-up Pending": "Awaiting Feedback",
  "Quotation Requested": "Quotation In Progress",
  "Order Placed": "Order Received",
  "Not Interested": "Closed",
  "Visit Completed": "Completed"
};
var TITLES = {
  customers: "Customers", orders: "Orders", visits: "Visits", products: "Products & Stock",
  messages: "Messages", analytics: "Analytics", coach: "Sales Coach",
  reports: "Sales Visit Report", settings: "Settings", home: "Home"
};
/* Language labels. Nyanja was written for basic labels; ask a native speaker to check before sharing widely.
   Bemba is not included until it can be checked by a native speaker. */
var I18N = {
  en: {home:"Home", customers:"Customers", orders:"Orders", visits:"Visits", more:"More", start:"Start my day",
       morning:"Good morning", afternoon:"Good afternoon", evening:"Good evening", at_glance:"Today at a glance",
       enter_pin:"Enter your PIN", wrong_pin:"Wrong PIN. Try again."},
  ny: {home:"Kunyumba", customers:"Makasitomala", orders:"Maoda", visits:"Maulendo", more:"Zina", start:"Yambani ntchito",
       morning:"Mwadzuka bwino", afternoon:"Masana abwino", evening:"Madzulo abwino", at_glance:"Lero mwachidule",
       enter_pin:"Lowetsani PIN yanu", wrong_pin:"PIN si yolondola. Yesaninso."}
};
function T(key) {
  var L = setting("lang", "en");
  return (I18N[L] && I18N[L][key]) || I18N.en[key] || key;
}

/* ---------- Helpers ---------- */
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pad(n) { return String(n).length < 2 ? "0" + n : String(n); }
function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function todayStr() { return ymd(new Date()); }
function nowText() { var d = new Date(); return ymd(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function money(v) {
  var n = Number(v || 0);
  var parts = n.toFixed(2).split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return CUR + parts.join(".");
}
function toFloat(t) { var n = parseFloat(String(t == null ? "" : t).replace(/,/g, "").trim()); return isNaN(n) ? 0 : n; }
function toInt(t, d) { var n = parseInt(String(t == null ? "" : t).trim(), 10); return isNaN(n) ? (d || 0) : n; }
function sum(arr) { var s = 0; for (var i = 0; i < arr.length; i++) s += Number(arr[i]) || 0; return s; }
function parseISO(t) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t || "");
  if (!m) return null;
  var d = new Date(+m[1], +m[2] - 1, +m[3]);
  return d.getMonth() === +m[2] - 1 ? d : null;
}
function validISO(t) { return !!parseISO(t); }
function weekStart(d) {
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function monthStart() { var n = new Date(); return ymd(new Date(n.getFullYear(), n.getMonth(), 1)); }
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function midnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function dmy(d) { return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear(); }
function reportDate(text) {
  if (!text) return dmy(new Date());
  var iso = parseISO(text);
  if (iso) return dmy(iso);
  var m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/.exec(String(text).trim());
  if (m) {
    var d = new Date(+m[3], +m[2] - 1, +m[1]);
    if (d.getMonth() === +m[2] - 1) return dmy(d);
  }
  return text;
}
function normalizePhone(raw) {
  var digits = String(raw || "").replace(/\D/g, "");
  if (!digits) return "";
  if (digits.indexOf("260") === 0) return digits;
  if (digits.charAt(0) === "0") return "260" + digits.slice(1);
  if (digits.length === 9) return "260" + digits;
  return digits;
}
function custName(c) { return c.shop || c.name; }
function custLabel(c) { return custName(c) + " (#" + c.id + ")"; }
function productLabel(p) { return p.name + " • " + money(p.unit_price) + " • stock " + p.stock_qty; }
function km(a, b) {
  var R = 6371, toR = function (x) { return x * Math.PI / 180; };
  var dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
  var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.asin(Math.sqrt(h));
}
function hasPos(c) { return c && c.lat != null && c.lng != null && c.lat !== "" && c.lng !== ""; }

/* ---------- Storage ---------- */
function emptyDb() {
  return {seq: {}, customers: [], visits: [], reports: [], products: [], orders: [],
          order_items: [], message_log: [], payments: [], bundles: [], settings: {}};
}
function loadDb() {
  try {
    var raw = localStorage.getItem(KEY);
    return raw ? Object.assign(emptyDb(), JSON.parse(raw)) : emptyDb();
  } catch (e) { return emptyDb(); }
}
var db = loadDb();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { showMsg("Storage full", "Could not save on this phone. Export a backup and remove old voice notes or photos."); }
}
function nextId(table) { db.seq[table] = (db.seq[table] || 0) + 1; return db.seq[table]; }
function setting(k, d) { var v = db.settings[k]; return v == null ? (d == null ? "" : d) : v; }

/* ---------- Business logic ---------- */
function activeOrders() { return db.orders.filter(function (o) { return o.status !== "Cancelled"; }); }
function orderItemsOf(orderId) { return db.order_items.filter(function (i) { return i.order_id === orderId; }); }
function lowStock() {
  return db.products.filter(function (p) { return p.stock_qty <= p.reorder_level; })
    .sort(function (a, b) { return a.stock_qty - b.stock_qty || a.name.localeCompare(b.name); });
}
function checkStock(items) {
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (it.product_id == null) continue;
    var p = db.products.filter(function (x) { return x.id === it.product_id; })[0];
    if (p && p.stock_qty < it.qty)
      throw new Error("Not enough stock for " + p.name + ": " + p.stock_qty + " left, " + it.qty + " needed.");
  }
}
function moveStock(items, dir) {
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (it.product_id == null) continue;
    var p = db.products.filter(function (x) { return x.id === it.product_id; })[0];
    if (p) p.stock_qty += dir * it.qty;
  }
}
function priceFor(cust, productId, fallback) {
  if (cust && cust.price_list && cust.price_list[productId] != null && cust.price_list[productId] !== "")
    return Number(cust.price_list[productId]);
  return fallback;
}
function createOrder(customerId, shop, orderDate, status, notes, visitId, items) {
  if (!items.length) throw new Error("Add at least one product to the order.");
  if (status !== "Quoted" && status !== "Confirmed")
    throw new Error("A new order can only be saved as a quotation or as confirmed.");
  if (status === "Confirmed") checkStock(items);
  var total = 0;
  for (var k = 0; k < items.length; k++) total += items[k].qty * items[k].unit_price;
  var id = nextId("orders");
  db.orders.push({id: id, customer_id: customerId, visit_id: visitId, shop_name: shop,
                  order_date: orderDate, status: status, total: total, notes: notes, created_at: nowText()});
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    db.order_items.push({id: nextId("order_items"), order_id: id, product_id: it.product_id,
                         product_name: it.product_name, qty: it.qty, unit_price: it.unit_price,
                         line_total: it.qty * it.unit_price});
  }
  if (status === "Confirmed") moveStock(items, -1);
  return id;
}
function changeOrderStatus(orderId, newStatus) {
  var order = db.orders.filter(function (o) { return o.id === orderId; })[0];
  if (!order) throw new Error("Order not found.");
  var old = order.status;
  if (old === newStatus) return;
  if (old === "Cancelled") throw new Error("A cancelled order cannot be reopened. Create a new order instead.");
  if (newStatus === "Quoted") throw new Error("An order cannot go back to a quotation. Create a new quotation instead.");
  var items = orderItemsOf(orderId);
  if (newStatus === "Confirmed") {
    if (old !== "Quoted") throw new Error("Only a quotation can be confirmed.");
    checkStock(items); moveStock(items, -1);
  } else if (newStatus === "Delivered") {
    if (old !== "Confirmed") throw new Error("Confirm the order before marking it delivered.");
  } else if (newStatus === "Cancelled") {
    if (old === "Confirmed" || old === "Delivered") moveStock(items, +1);
  }
  order.status = newStatus;
  save();
}
function latestOrderFor(customerId) {
  var list = db.orders.filter(function (o) { return o.customer_id === customerId; })
    .sort(function (a, b) { return b.order_date.localeCompare(a.order_date) || b.id - a.id; });
  return list[0] || null;
}
function salesByWeek(weeks) {
  weeks = weeks || 8;
  var start = weekStart(new Date());
  start.setDate(start.getDate() - (weeks - 1) * 7);
  var startStr = ymd(start), buckets = [];
  for (var i = 0; i < weeks; i++) {
    var d = new Date(start); d.setDate(d.getDate() + i * 7);
    buckets.push({key: ymd(d), start: d, total: 0, count: 0});
  }
  activeOrders().forEach(function (o) {
    if (o.order_date < startStr) return;
    var d = parseISO(o.order_date);
    if (!d) return;
    var key = ymd(weekStart(d));
    buckets.forEach(function (b) { if (b.key === key) { b.total += o.total || 0; b.count += 1; } });
  });
  return buckets;
}
function weekSalesTotal() {
  var ws = ymd(weekStart(new Date()));
  return sum(activeOrders().filter(function (o) { return o.order_date >= ws; }).map(function (o) { return o.total; }));
}
function monthSalesTotal() {
  var ms = monthStart();
  return sum(activeOrders().filter(function (o) { return o.order_date >= ms; }).map(function (o) { return o.total; }));
}
function billedOf(name) { return sum(activeOrders().filter(function (o) { return o.shop_name === name; }).map(function (o) { return o.total; })); }
function paidOf(name) { return sum(db.payments.filter(function (p) { return p.shop_name === name; }).map(function (p) { return p.amount; })); }
function balanceOf(name) { return billedOf(name) - paidOf(name); }
function lastOrderDate(name) {
  var last = null;
  activeOrders().forEach(function (o) { if (o.shop_name === name && (!last || o.order_date > last)) last = o.order_date; });
  return last;
}
function overdueShops() {
  var today = midnight(new Date()), out = [];
  db.customers.forEach(function (c) {
    var name = custName(c);
    if (balanceOf(name) <= 0) return;
    var d = parseISO(lastOrderDate(name));
    if (d && daysBetween(d, today) > 14) out.push({name: name, balance: balanceOf(name)});
  });
  return out;
}
function patternOf(name) {
  var dates = activeOrders().filter(function (o) { return o.shop_name === name; })
    .map(function (o) { return parseISO(o.order_date); }).filter(Boolean)
    .sort(function (a, b) { return a - b; });
  if (dates.length < 2) return null;
  var first = dates[0], last = dates[dates.length - 1];
  var avg = Math.max(1, Math.round(daysBetween(first, last) / (dates.length - 1)));
  var expected = new Date(last.getFullYear(), last.getMonth(), last.getDate() + avg);
  return {avg: avg, expected: expected, last: last};
}
function dueRestocks() {
  var today = midnight(new Date()), out = [];
  db.customers.forEach(function (c) {
    var p = patternOf(custName(c));
    if (p && daysBetween(today, p.expected) <= 3) out.push({name: custName(c), expected: p.expected});
  });
  return out;
}
function followUps() {
  var today = new Date(), todayIso = ymd(today), items = [];
  db.visits.filter(function (v) { return v.status !== "Completed" && v.follow_up_date && v.follow_up_date <= todayIso; })
    .sort(function (a, b) { return a.follow_up_date.localeCompare(b.follow_up_date); })
    .forEach(function (v) { items.push([0, v.shop_name, "follow-up was due " + v.follow_up_date]); });
  var last = {};
  activeOrders().forEach(function (o) {
    if (!last[o.shop_name] || o.order_date > last[o.shop_name]) last[o.shop_name] = o.order_date;
  });
  db.customers.forEach(function (c) {
    var shop = custName(c), d = parseISO(last[shop]);
    if (!d) items.push([2, shop, "has never ordered"]);
    else {
      var days = daysBetween(d, midnight(today));
      if (days > 30) items.push([1, shop, "last order " + days + " days ago"]);
    }
  });
  items.sort(function (a, b) { return a[0] - b[0]; });
  var seen = {}, result = [];
  items.forEach(function (it) {
    if (seen[it[1]]) return;
    seen[it[1]] = true;
    result.push((result.length + 1) + ". " + it[1] + ": " + it[2]);
  });
  return result.slice(0, 10);
}

/* Route planning: start from current position, go to the nearest unvisited shop each time. */
function custOfVisit(v) {
  var c = null;
  if (v.customer_id != null) c = db.customers.filter(function (x) { return x.id === v.customer_id; })[0] || null;
  if (!c) c = db.customers.filter(function (x) { return custName(x) === v.shop_name; })[0] || null;
  return c;
}
function planRoute(visits) {
  var withPos = [], noPos = [];
  visits.forEach(function (v) {
    var c = custOfVisit(v);
    if (hasPos(c)) withPos.push({v: v, c: c});
    else noPos.push({v: v, c: c, km: null});
  });
  var ordered = [], cur = S.here || null;
  if (!cur && withPos.length) {
    var first = withPos.shift();
    ordered.push({v: first.v, c: first.c, km: null});
    cur = {lat: Number(first.c.lat), lng: Number(first.c.lng)};
  }
  while (withPos.length && cur) {
    var bi = 0, bd = Infinity;
    for (var i = 0; i < withPos.length; i++) {
      var d = km(cur, {lat: Number(withPos[i].c.lat), lng: Number(withPos[i].c.lng)});
      if (d < bd) { bd = d; bi = i; }
    }
    var pick = withPos.splice(bi, 1)[0];
    ordered.push({v: pick.v, c: pick.c, km: bd});
    cur = {lat: Number(pick.c.lat), lng: Number(pick.c.lng)};
  }
  return ordered.concat(noPos);
}

function reminderSections() {

  var now = midnight(new Date());

    .sort(function (a, b) { return a.order_date.localeCompare(b.order_date); })
    .forEach(function (q) {

  var rest = dueRestocks().map(function (r) { return r.name + ": usually reorders around now"; });

    }

}

function askAI(system, user, imageUri) {
  var key = setting("ai_api_key", "").trim();
  if (!key) return Promise.reject(new Error("Add your AI API key in Settings first."));
  var endpoint = (setting("ai_endpoint", DEFAULT_ENDPOINT) || DEFAULT_ENDPOINT).trim();
  var model = (setting("ai_model", DEFAULT_MODEL) || DEFAULT_MODEL).trim();
  var content = imageUri
    ? [{type: "text", text: user}, {type: "image_url", image_url: {url: imageUri}}]
    : user;
  return fetch(endpoint, {
    method: "POST",
    headers: {"Content-Type": "application/json", "Authorization": "Bearer " + key},
    body: JSON.stringify({model: model, messages: [{role: "system", content: system}, {role: "user", content: content}], temperature: 0.2})
  }).then(function (res) {
    if (!res.ok) {
      return res.text().then(function (d) {
        throw new Error("Online AI error (HTTP " + res.status + "). Check API key, model and endpoint.\n" + d.slice(0, 500));
      }, function () {
        throw new Error("Online AI error (HTTP " + res.status + "). Check API key, model and endpoint.");
      });
    }
    return res.json();
  }, function (e) {
    throw new Error("Could not reach online AI: " + e.message + "\nThe offline version is still available.");
  }).then(function (data) {
    return data.choices[0].message.content.trim();
  });
}

function captureLocation(latId, lngId, gpsId) {
  if (!navigator.geolocation) { showMsg("Location", "Location is not available on this phone."); return; }
  var gps = document.getElementById(gpsId);
  if (gps) gps.textContent = "Finding your location...";
  navigator.geolocation.getCurrentPosition(function (pos) {
    document.getElementById(latId).value = pos.coords.latitude;
    document.getElementById(lngId).value = pos.coords.longitude;
    if (gps) gps.textContent = "Location pin saved: " + pos.coords.latitude.toFixed(5) + ", " + pos.coords.longitude.toFixed(5);
  }, function () {
    if (gps) gps.textContent = "Location pin: not set";
    showMsg("Location", "Could not get your location. Check that location is turned on and allowed for this app.");
  }, {enableHighAccuracy: true, timeout: 10000});
}
function setLocationFor(id) {
  if (!navigator.geolocation) { showMsg("Location", "Location is not available on this phone."); return; }
  navigator.geolocation.getCurrentPosition(function (pos) {
    var c = db.customers.filter(function (x) { return x.id === id; })[0];
    if (!c) return;
    c.lat = pos.coords.latitude; c.lng = pos.coords.longitude;
    save(); render();
    showMsg("Location saved", custName(c) + " is now on your route map.");
  }, function () {
    showMsg("Location", "Could not get your location. Check that location is turned on and allowed for this app.");
  }, {enableHighAccuracy: true, timeout: 10000});
}
function saveCustomer() {
  var shop = document.getElementById("c_shop").value.trim();
  if (!shop) { showMsg("Missing shop name", "Please enter a shop or business name."); return; }
  var latV = document.getElementById("c_lat").value, lngV = document.getElementById("c_lng").value;
  db.customers.push({
    id: nextId("customers"),
    name: document.getElementById("c_name").value.trim(),
    shop: shop,
    phone: document.getElementById("c_phone").value.trim(),
    location: document.getElementById("c_loc").value.trim(),
    products: document.getElementById("c_prod").value.trim(),
    notes: document.getElementById("c_notes").value.trim(),
    lat: latV === "" ? null : Number(latV),
    lng: lngV === "" ? null : Number(lngV),
    price_list: {}, photo: "", voice: "", created_at: nowText()
  });
  save();
  showMsg("Saved", shop + " has been saved on this phone.");
  render();
}
function custAction(id, screen) {
  var c = db.customers.filter(function (x) { return x.id === id; })[0];
  if (!c) return;
  setPending(c.id, custName(c));
  go(screen);
}
function deleteCustomer(id) {
  db.customers = db.customers.filter(function (c) { return c.id !== id; });
  save();
  showMsg("Deleted", "Customer record deleted. Visit, order and payment history is kept.");
  render();
}
function pickFile(id, kind) {
  S.pickFor = {id: id, kind: kind};
  document.getElementById(kind === "photo" ? "shopPhotoIn" : "voiceIn").click();
}
function onShopPhoto(input) {
  var f = input.files && input.files[0];
  input.value = "";
  if (!f || !S.pickFor) return;
  var c = db.customers.filter(function (x) { return x.id === S.pickFor.id; })[0];
  if (!c) return;
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var max = 480, scale = Math.min(1, max / Math.max(img.width, img.height));
      var cv = document.createElement("canvas");
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      c.photo = cv.toDataURL("image/jpeg", 0.7);
      save(); S.pickFor = null; render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
}
function onVoice(input) {
  var f = input.files && input.files[0];
  input.value = "";
  if (!f || !S.pickFor) return;
  if (f.size > 1500000) { showMsg("Voice note too large", "Choose a voice note under 1.5 MB. Record a shorter note."); return; }
  var c = db.customers.filter(function (x) { return x.id === S.pickFor.id; })[0];
  if (!c) return;
  var reader = new FileReader();
  reader.onload = function () { c.voice = reader.result; save(); S.pickFor = null; render(); };
  reader.readAsDataURL(f);
}

function savePayment(id) {

function priceModal(id) {

    "<button class=\"btn muted\" onclick=\"closeModal()\">Cancel</button>");

function savePriceList(id) {
  var c = db.customers.filter(function (x) { return x.id === id; })[0];
  if (!c) return;
  var list = {};
  var inputs = document.querySelectorAll("#modal input[data-pid]");
  for (var i = 0; i < inputs.length; i++) {
    var v = inputs[i].value.trim();
    if (v !== "" && !isNaN(parseFloat(v))) list[inputs[i].getAttribute("data-pid")] = parseFloat(v);
  }
  c.price_list = list;
  save(); closeModal(); render();
  showMsg("Saved", "Price list saved for " + custName(c) + ".");

function screenRoute() {
  var today = todayStr();
  var visits = db.visits.filter(function (v) { return v.visit_date === today && v.status !== "Completed"; });
  var plan = planRoute(visits);
  var head = "<button class=\"btn navy\" onclick=\"captureHere()\">📍 Use my current location as start</button>" +
    "<div class=\"note\">" + (S.here ? "Starting from your location. Shops are ordered by the nearest next stop." :
      "No start location yet. Tap the button above to plan from where you are.") + "</div>";
  if (!plan.length) return head + "<p>No visits planned for today. Add one in Plan.</p>";
  return head + plan.map(function (p, i) {
    var c = p.c;
    var hasMap = hasPos(c);
    var dist = p.km != null ? p.km.toFixed(1) + " km from the previous stop" : (hasMap ? "Start of route" : "No location saved");
    return "<div class=\"card\"><h4><span>" + (i + 1) + ". " + esc(p.v.shop_name) + "</span>" +
      (hasMap ? "<span class=\"tag green\">📍</span>" : "<span class=\"tag amber\">no map</span>") + "</h4>" +
      "<div class=\"meta\">" + esc(dist) + (c && c.location ? "\n" + esc(c.location) : "") + "</div>" +
      "<div style=\"margin-top:6px\">" +
        (hasMap ? "<button class=\"btn small navy\" onclick=\"navigateTo(" + Number(c.lat) + "," + Number(c.lng) + ")\">Navigate</button>" : "") +
        "<button class=\"btn small green\" onclick=\"completeVisit(" + p.v.id + ")\">Done</button>" +
        "<button class=\"btn small\" onclick=\"orderFromVisit(" + p.v.id + ")\">Order</button>" +
        "<button class=\"btn small navy\" onclick=\"reportFromVisit(" + p.v.id + ")\">Report</button>" +
      "</div></div>";
  }).join("");
}
function captureHere() {
  if (!navigator.geolocation) { showMsg("Location", "Location is not available on this phone."); return; }
  navigator.geolocation.getCurrentPosition(function (pos) {
    S.here = {lat: pos.coords.latitude, lng: pos.coords.longitude};
    render();
  }, function () {
    showMsg("Location", "Could not get your location. Check that location is turned on and allowed for this app.");
  }, {enableHighAccuracy: true, timeout: 10000});
}
function navigateTo(lat, lng) {
  window.open("https://www.google.com/maps/dir/?api=1&destination=" + lat + "," + lng, "_blank");
}
function saveVisit() {
  var shop = document.getElementById("v_shop").value.trim();
  if (!shop) { showMsg("Missing shop name", "Enter the shop name for this visit."); return; }
  var visitDate = document.getElementById("v_date").value.trim();
  var follow = document.getElementById("v_follow").value.trim();
  if (visitDate && !validISO(visitDate)) { showMsg("Date format", "Please enter visit date as YYYY-MM-DD."); return; }
  if (follow && !validISO(follow)) { showMsg("Date format", "Please enter follow-up date as YYYY-MM-DD."); return; }
  db.visits.push({
    id: nextId("visits"), customer_id: S.pendingCustomer, shop_name: shop, visit_date: visitDate,
    purpose: document.getElementById("v_purpose").value.trim(),
    outcome: document.getElementById("v_outcome").value.trim(),
    follow_up_date: follow, status: "Planned",
    notes: document.getElementById("v_notes").value.trim(), created_at: nowText()
  });
  save(); setPending();
  showMsg("Visit saved", "Visit for " + shop + " has been saved.");
  render();
}
function completeVisit(id) {
  var v = db.visits.filter(function (x) { return x.id === id; })[0];
  if (v) v.status = "Completed";
  save(); render();
}
function orderFromVisit(id) {
  var v = db.visits.filter(function (x) { return x.id === id; })[0];
  if (!v) return;
  setPending(v.customer_id, v.shop_name, v.id);
  go("orders");
}
function reportFromVisit(id) {
  var v = db.visits.filter(function (x) { return x.id === id; })[0];
  if (!v) return;
  S.reportVisit = v; S.rp = null;
  go("reports");
}
function deleteVisit(id) {
  db.visits = db.visits.filter(function (v) { return v.id !== id; });
  save(); render();
}

function screenOrders() {
  var empty = db.customers.length === 0 || db.products.length === 0

  var draftTotal = sum(S.draft.map(function (i) { return i.qty * i.unit_price; }));
  var orders = db.orders.slice().sort(function (a, b) { return b.id - a.id; }).slice(0, 50);
  var bundles = db.bundles.map(function (b) { return "<option value=\"" + b.id + "\">" + esc(b.name) + "</option>"; }).join("");
  var draftHtml = S.draft.map(function (it, i) {
    return "<div class=\"card row\"><div class=\"meta\" style=\"flex:1\">" + it.qty + " × " + esc(it.product_name) + " = " + money(it.qty * it.unit_price) + "</div>" +
      "<button class=\"btn small red fixed\" onclick=\"removeDraftItem(" + i + ")\">Remove</button></div>";
  }).join("");
  return "<h3>New order or quotation</h3>" + empty +
    "<select id=\"o_cust\">" + custOptions(S.pendingCustomer) + "</select>" +
    "<select id=\"o_prod\">" + productOptions(null) + "</select>" +

      "<button class=\"btn small navy fixed\" onclick=\"addBundle()\">Add bundle</button></div>" : "") +
    draftHtml +
    "<h4 style=\"color:var(--navy)\">Order total: " + money(draftTotal) + "</h4>" +
    "<p>Prices use the customer's price list when one is set.</p>" +
    "<label>Order date (YYYY-MM-DD)</label><input id=\"o_date\" value=\"" + todayStr() + "\">" +
    "<select id=\"o_status\"><option>Quoted</option><option>Confirmed</option></select>" +
    "<textarea id=\"o_notes\" placeholder=\"Notes, delivery or payment terms (optional)\"></textarea>" +
    "<button class=\"btn green\" onclick=\"saveOrder()\">Save order</button>" +
    "<p>Quotation: saved without touching stock. Confirmed: stock is taken out now. Save as Quoted and confirm later if you are not sure.</p>" +
    "<h3>Orders</h3>" + (orders.length ? "" : "<p>No orders yet.</p>") +
    orders.map(function (o) {
      var items = orderItemsOf(o.id), s = o.status;
      return "<div class=\"card\"><h4><span>#" + o.id + " • " + esc(o.shop_name) + "</span>" + statusTag(s) + "</h4>" +
        "<div class=\"meta\">" + esc(o.order_date) + " • Total: " + money(o.total) + "\n" +
        items.map(function (i) { return "• " + i.qty + " × " + i.product_name; }).join("\n") +
        (o.notes ? "\nNotes: " + o.notes : "") + "</div>" +
        "<div style=\"margin-top:6px\">" +
          (s === "Quoted" ? "<button class=\"btn small green\" onclick=\"setOrderStatus(" + o.id + ",'Confirmed')\">Confirm</button>" : "") +
          (s === "Confirmed" ? "<button class=\"btn small green\" onclick=\"setOrderStatus(" + o.id + ",'Delivered')\">Delivered</button>" : "") +
          (["Quoted", "Confirmed", "Delivered"].indexOf(s) !== -1 ?
            "<button class=\"btn small red\" onclick=\"setOrderStatus(" + o.id + ",'Cancelled')\">Cancel</button>" +
            "<button class=\"btn small\" onclick=\"messageForOrder(" + o.id + ")\">Message</button>" : "") +
        "</div></div>";
    }).join("");
}
function addDraftItem() {
  var prodId = parseInt(document.getElementById("o_prod").value, 10);
  var qty = toInt(document.getElementById("o_qty").value, 0);
  var p = db.products.filter(function (x) { return x.id === prodId; })[0];
  if (!p) { showMsg("Choose a product", "Select a product from the list first."); return; }
  if (qty <= 0) { showMsg("Quantity", "Enter how many units the customer wants."); return; }
  var cust = db.customers.filter(function (c) { return c.id === parseInt(document.getElementById("o_cust").value, 10); })[0];
  S.draft.push({product_id: p.id, product_name: p.name, qty: qty, unit_price: priceFor(cust, p.id, p.unit_price)});
  render();
}
function addBundle() {
  var bid = parseInt(document.getElementById("o_bundle").value, 10);
  var b = db.bundles.filter(function (x) { return x.id === bid; })[0];
  if (!b) return;
  var cust = db.customers.filter(function (c) { return c.id === parseInt(document.getElementById("o_cust").value, 10); })[0];
  b.items.forEach(function (it) {
    var p = db.products.filter(function (x) { return x.id === it.product_id; })[0];
    if (p) S.draft.push({product_id: p.id, product_name: p.name, qty: it.qty, unit_price: priceFor(cust, p.id, p.unit_price)});
  });
  render();
}
function removeDraftItem(i) { S.draft.splice(i, 1); render(); }
function saveOrder() {
  var custId = parseInt(document.getElementById("o_cust").value, 10);
  var cust = db.customers.filter(function (c) { return c.id === custId; })[0];
  if (!cust) { showMsg("Choose a customer", "Select a customer before saving the order."); return; }
  if (!S.draft.length) { showMsg("No items", "Add at least one product to the order."); return; }
  var orderDate = document.getElementById("o_date").value.trim() || todayStr();
  if (!validISO(orderDate)) { showMsg("Date format", "Please enter the order date as YYYY-MM-DD."); return; }
  var status = document.getElementById("o_status").value;
  var notes = document.getElementById("o_notes").value.trim();
  var visitId = S.pendingCustomer === cust.id ? S.pendingVisit : null;
  S.draft.forEach(function (it) {
    var p = db.products.filter(function (x) { return x.id === it.product_id; })[0];
    if (p) it.unit_price = priceFor(cust, p.id, p.unit_price);
  });
  var orderId;
  try {
    orderId = createOrder(cust.id, custName(cust), orderDate, status, notes, visitId, S.draft);
  } catch (e) {
    showMsg("Could not save order", e.message);
    return;
  }
  save();
  S.draft = []; setPending();
  S.pendingOrder = orderId;
  showMsg("Order saved", "Order #" + orderId + " saved as " + status + ". Open Messages to send the customer a confirmation or quotation.");
  render();
}
function setOrderStatus(id, status) {

  catch (e) { showMsg("Cannot change order", e.message); return; }
  render();
}
function messageForOrder(id) {

}

/* ---------- Analytics ---------- */
function screenAnalytics() {
  var byShop = {};
  activeOrders().forEach(function (o) {
    if (!byShop[o.shop_name]) byShop[o.shop_name] = {n: 0, s: 0};
    byShop[o.shop_name].n += 1; byShop[o.shop_name].s += o.total || 0;
  });
  var shops = Object.keys(byShop).map(function (k) { return [k, byShop[k]]; })
    .sort(function (a, b) { return b[1].n - a[1].n || b[1].s - a[1].s; }).slice(0, 10);

  var since = new Date(); since.setDate(since.getDate() - 30);
  var sinceStr = ymd(since), byProd = {};
  activeOrders().forEach(function (o) {
    if (o.order_date < sinceStr) return;
    orderItemsOf(o.id).forEach(function (i) {
      if (!byProd[i.product_name]) byProd[i.product_name] = {units: 0, revenue: 0};
      byProd[i.product_name].units += i.qty; byProd[i.product_name].revenue += i.line_total;
    });
  });
  var products = Object.keys(byProd).map(function (k) { return [k, byProd[k]]; })
    .sort(function (a, b) { return b[1].units - a[1].units; }).slice(0, 10);

  var totalVisits = db.visits.length;
  var withOrders = {};
  activeOrders().forEach(function (o) { if (o.visit_id != null) withOrders[o.visit_id] = true; });
  var visitsWith = Object.keys(withOrders).length;
  var rate = totalVisits ? visitsWith / totalVisits * 100 : 0;

  var weeks = salesByWeek(8);
  var maxW = 1;
  weeks.forEach(function (w) { if (w.total > maxW) maxW = w.total; });
  var change = "";
  if (weeks.length >= 2 && weeks[weeks.length - 2].total > 0) {
    var c = (weeks[weeks.length - 1].total - weeks[weeks.length - 2].total) / weeks[weeks.length - 2].total * 100;
    change = "<h4 style=\"color:var(--navy)\">This week vs last week: " + (c >= 0 ? "+" : "") + c.toFixed(0) + "%</h4>";
  }
  var rate2 = toFloat(setting("commission_rate", 0));
  var commMonth = monthSalesTotal() * rate2 / 100;
  var patterns = db.customers.map(function (c) { return [custName(c), patternOf(custName(c))]; })
    .filter(function (x) { return x[1]; });
  return "<h3>Commission and targets</h3>" +
    "<div class=\"card meta\">Sales this month: " + money(monthSalesTotal()) +
    (rate2 > 0 ? "\nEstimated commission at " + rate2 + "%: " + money(commMonth) : "\nSet your commission rate in Settings to see an estimate.") + "</div>" +
    "<h3>Orders by shop</h3>" + (shops.length ? "" : "<p>No orders yet.</p>") +
    shops.map(function (s) { return "<div class=\"card meta\">" + esc(s[0]) + ": " + s[1].n + " order(s), " + money(s[1].s) + "</div>"; }).join("") +
    "<h3>Fastest-selling products (last 30 days)</h3>" + (products.length ? "" : "<p>No sales in the last 30 days.</p>") +
    products.map(function (p) { return "<div class=\"card meta\">" + esc(p[0]) + ": " + p[1].units + " units, " + money(p[1].revenue) + "</div>"; }).join("") +
    "<h3>Visits that led to an order</h3>" +
    "<div class=\"card meta\">" + visitsWith + " of " + totalVisits + " visits led to an order (" + rate.toFixed(0) + "%).</div>" +
    "<h3>Buying patterns</h3>" + (patterns.length ? "" : "<p>Shops with two or more orders will show their buying rhythm here.</p>") +
    patterns.map(function (x) { return "<div class=\"card meta\">" + esc(x[0]) + ": every ~" + x[1].avg + " days, next around " + dmy(x[1].expected) + "</div>"; }).join("") +
    "<h3>Weekly sales (last 8 weeks)</h3>" +
    "<div class=\"chart\">" + weeks.map(function (w) {
      var h = Math.max(2, Math.round(w.total / maxW * 100));
      return "<div class=\"col\"><div style=\"flex:1;width:100%;display:flex;align-items:flex-end\"><div class=\"bar2\" style=\"height:" + h + "%\"></div></div>" +
        "<small>" + w.start.getDate() + " " + w.start.toLocaleDateString("en-GB", {month: "short"}) + "<br>" + CUR + Math.round(w.total).toLocaleString("en-US") + "<br>" + w.count + " ord.</small></div>";
    }).join("") + "</div>" + change +
    "<p>Week-over-week change compares each week with the one before it.</p>";
}

function collectReport() {
  var f = S.rp;
  return {
    shop: (f.shop || "").trim(), date: reportDate((f.date || "").trim()),
    rep: (f.rep || "").trim() || "Sales Representative", outcome_type: f.outcome_type,
    products: (f.products || "").trim(), outcome: (f.outcome || "").trim(),
    next: (f.next || "").trim(), extra: (f.extra || "").trim()
  };
}
function buildReport(d) {
  var opening = d.products
    ? "I visited " + d.shop + " to introduce and promote " + d.products + "."
    : "I visited " + d.shop + " to follow up on our business relationship.";
  var story = d.outcome || "No response from the customer was recorded during this visit.";
  var nextAction = d.next || "I will follow up with the customer to confirm their decision and any possible order.";
  var status = REPORT_OUTCOMES[d.outcome_type] || "Recorded";
  var lines = [
    "SALES VISIT REPORT", "",
    "Shop Name: " + d.shop,
    "Sales Representative: " + d.rep,
    "Date: " + d.date,
    "Visit Outcome: " + d.outcome_type, "",
    opening + " " + story, "",
    "Next Action: " + nextAction, "",
    "Status: " + status + "."
  ];
  if (d.extra) lines.push("", "Additional Notes: " + d.extra);
  return lines.join("\n");
}
function reportOffline() {
  var d = collectReport();
  if (!d.shop) { showMsg("Missing shop name", "Enter the shop or customer name first."); return; }
  S.reportOut = buildReport(d);

}
function reportOnline() {
  var d = collectReport();
  if (!d.shop) { showMsg("Missing shop name", "Enter the shop or customer name first."); return; }
  if (!setting("ai_api_key", "").trim()) {
    showMsg("Online AI not configured", "Generate the offline report now. To enable online AI, open Settings and add your AI provider API key. API usage may cost money.");
    return;
  }
  var report = buildReport(d);
  var out = document.getElementById("report_out");
  out.value = report + "\n\nPolishing with online AI...";
  askAI("You are a careful sales reporting assistant. Never invent facts.",
    "Rewrite the following sales visit report in concise, professional business English. Keep exactly this layout and these labels. Do not invent facts, numbers, orders, promises, or dates. Return only the finished report.\n\n" + report)
    .then(function (text) { S.reportOut = text; out.value = text; })
    .catch(function (e) { S.reportOut = report; out.value = report; showMsg("Online AI error", e.message); });
}

  var rows = db.reports.slice().sort(function (a, b) { return b.id - a.id; }).slice(0, 30);
  if (!rows.length) { showMsg("Report history", "No saved reports yet."); return; }
  openModal("<h3>Saved reports (latest 30)</h3>" + rows.map(function (r) {
    return "<div class=\"card\"><h4><span>" + esc(r.title) + "</span></h4><div class=\"meta\">" + esc(r.created_at) + "</div>" +
      "<div class=\"pre\">" + esc(r.body.slice(0, 240)) + "</div></div>";
  }).join("") + "<button class=\"btn\" onclick=\"closeModal()\">Close</button>");
}
function startPhotoDetect() {
  if (!setting("ai_api_key", "").trim()) {
    showMsg("Online AI not configured", "Photo detection uses online AI. Add your AI provider API key in Settings first. You can still type the products by hand.");
    return;
  }
  document.getElementById("photoIn").click();
}
function onPhotoPicked(input) {
  var file = input.files && input.files[0];
  input.value = "";
  if (!file) return;
  if (file.size > 4 * 1024 * 1024) { showMsg("Photo too large", "Choose a photo under 4 MB. Tip: take the photo at a lower resolution."); return; }
  var reader = new FileReader();
  reader.onload = function () {
    S.photoStatus = "Looking at the photo. This can take a moment...";
    var st = document.getElementById("photo_status");
    if (st) st.textContent = S.photoStatus;
    askAI(
      "You identify products in photos for a small sales representative in Zambia. Only list products you can actually see. Never invent brands or models. Reply with only a JSON array of short product names, for example [\"itel earphones\", \"phone chargers\"]. If no products can be identified, reply with [].",
      "List the products visible in this photo.", reader.result)
      .then(function (text) { applyDetected(text); })
      .catch(function (e) {
        S.photoStatus = "Photo detection failed. You can type the products by hand.";
        render();
        showMsg("Photo detection error", e.message);
      });
  };
  reader.readAsDataURL(file);
}
function applyDetected(text) {
  var raw = String(text || "").replace(/```json|```/g, "").trim();
  var names = [];
  try {
    var arr = JSON.parse(raw);
    if (!Array.isArray(arr)) throw new Error("not a list");
    names = arr.map(function (x) { return String(x).trim(); }).filter(Boolean);
  } catch (e) {
    names = raw.split(/[\n,]/).map(function (s) { return s.trim().replace(/^[-*'"\s]+|[-*'"\s]+$/g, ""); }).filter(Boolean);
  }
  var existing = (S.rp.products || "").split(",").map(function (p) { return p.trim(); }).filter(Boolean);
  var known = {};
  existing.forEach(function (p) { known[p.toLowerCase()] = true; });
  names.forEach(function (n) {
    if (!known[n.toLowerCase()]) { existing.push(n); known[n.toLowerCase()] = true; }
  });
  S.rp.products = existing.join(", ");
  S.photoStatus = names.length
    ? "Found " + names.length + " product(s) in the photo and added them to Products promoted. Check the list and edit if needed."
    : "No products could be identified. Type them in by hand.";
  render();
}

/* ---------- Settings ---------- */
function screenSettings() {
  var lang = setting("lang", "en");
  var pinSet = !!setting("pin", "");
  return "<h3>Personal settings</h3>" +
    "<input id=\"s_rep\" placeholder=\"Your name for messages and reports\" value=\"" + esc(setting("rep_name", "")) + "\">" +
    "<label>Language</label><select id=\"s_lang\"><option value=\"en\"" + (lang === "en" ? " selected" : "") + ">English</option>" +
      "<option value=\"ny\"" + (lang === "ny" ? " selected" : "") + ">Nyanja (basic labels)</option></select>" +
    "<label>Weekly sales target (K)</label><input id=\"s_target\" inputmode=\"decimal\" value=\"" + esc(setting("target_week", "")) + "\" placeholder=\"e.g. 5000\">" +
    "<label>Commission rate (%)</label><input id=\"s_rate\" inputmode=\"decimal\" value=\"" + esc(setting("commission_rate", "")) + "\" placeholder=\"e.g. 5\">" +
    "<h3>Start screen PIN</h3>" +
    "<p>" + (pinSet ? "A PIN is set. The app asks for it each time you open it." : "No PIN is set. Set a 4-digit PIN to lock the app when it opens.") + "</p>" +
    "<input id=\"s_pin\" inputmode=\"numeric\" maxlength=\"4\" placeholder=\"New 4-digit PIN (leave empty to keep current)\">" +
    (pinSet ? "<button class=\"btn muted\" onclick=\"clearPin()\">Remove PIN</button>" : "") +
    "<h3>Online AI configuration</h3>" +
    "<p>The offline features work without these fields. Your API key is stored on this phone only. Keep your phone locked.</p>" +
    "<input id=\"s_endpoint\" placeholder=\"API endpoint\" value=\"" + esc(setting("ai_endpoint", DEFAULT_ENDPOINT)) + "\">" +
    "<input id=\"s_model\" placeholder=\"Model name\" value=\"" + esc(setting("ai_model", DEFAULT_MODEL)) + "\">" +
    "<input id=\"s_key\" type=\"password\" placeholder=\"API key (stored locally)\" value=\"" + esc(setting("ai_api_key", "")) + "\">" +
    "<button class=\"btn green\" onclick=\"saveSettings()\">Save settings</button>" +
    "<h3>Reminders</h3>" +
    "<p>The app checks once a day while it is open and shows reminders about visits, follow-ups, payments, restocks and quotations. Allow notifications for phone alerts.</p>" +
    "<select id=\"s_remon\"><option" + (setting("reminders_on", "On") === "On" ? " selected" : "") + ">On</option><option" + (setting("reminders_on", "On") === "Off" ? " selected" : "") + ">Off</option></select>" +
    "<input id=\"s_time\" placeholder=\"Daily reminder time (HH:MM, 24-hour)\" value=\"" + esc(setting("reminder_time", "08:00")) + "\">" +
    "<button class=\"btn teal\" onclick=\"enableNotifications()\">Allow notifications</button>" +
    "<button class=\"btn teal\" onclick=\"notifyReminders(true)\">Send reminders now</button>" +
    "<h3>Data &amp; privacy</h3>" +
    "<p>Customers, visits, orders, payments and messages stay on this phone unless you share them yourself or use online AI. Online AI sends the text you ask about to the provider you set up.</p>" +
    "<button class=\"btn\" onclick=\"exportBackup()\">Export backup</button>" +
    "<button class=\"btn muted\" onclick=\"document.getElementById('restoreIn').click()\">Restore from backup</button>" +
    "<p>Backups are created without your API key. You will need to enter the key again after restoring.</p>" +
    "<p>App version: " + VERSION + " • Built for Android (HTML to APK)</p>";
}
function saveSettings() {
  var t = document.getElementById("s_time").value.trim();
  var m = /^([01]?\d|2[0-3]):([0-5]\d)$/.exec(t);
  if (!m) { showMsg("Check reminder time", "Use 24-hour format, for example 08:00 or 17:30."); return; }
  var pin = document.getElementById("s_pin").value.trim();
  if (pin !== "" && !/^\d{4}$/.test(pin)) { showMsg("PIN", "The PIN must be exactly 4 digits."); return; }
  db.settings.rep_name = document.getElementById("s_rep").value.trim();
  db.settings.lang = document.getElementById("s_lang").value;
  db.settings.target_week = toFloat(document.getElementById("s_target").value) || "";
  db.settings.commission_rate = toFloat(document.getElementById("s_rate").value) || "";
  if (pin) db.settings.pin = pin;
  db.settings.ai_endpoint = document.getElementById("s_endpoint").value.trim() || DEFAULT_ENDPOINT;
  db.settings.ai_model = document.getElementById("s_model").value.trim() || DEFAULT_MODEL;
  db.settings.ai_api_key = document.getElementById("s_key").value.trim();
  db.settings.reminders_on = document.getElementById("s_remon").value;
  db.settings.reminder_time = pad(+m[1]) + ":" + m[2];
  save();
  showMsg("Settings saved", "Your settings have been saved on this phone.");
  render();
}
function clearPin() {
  delete db.settings.pin;
  save();
  showMsg("PIN removed", "The app will open without asking for a PIN.");
  render();
}
function exportBackup() {
  var copy = JSON.parse(JSON.stringify(db));
  if (copy.settings) delete copy.settings.ai_api_key;
  var blob = new Blob([JSON.stringify(copy, null, 2)], {type: "application/json"});
  var url = URL.createObjectURL(blob);
  var stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, "");
  var a = document.createElement("a");
  a.href = url; a.download = "salesrep_ai_backup_" + stamp + ".json";
  document.body.appendChild(a); a.click(); a.parentNode.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  showMsg("Backup created", "The backup file has been downloaded. It does not include your API key. Keep it somewhere safe.");
}
function restoreBackup(input) {
  var file = input.files && input.files[0];
  input.value = "";
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.customers) || !Array.isArray(data.orders)) throw new Error("This is not a SalesRep AI backup.");
      var key = setting("ai_api_key", "");
      db = Object.assign(emptyDb(), data);
      db.settings = db.settings || {};
      db.settings.ai_api_key = key;
      save();
      showMsg("Restored", "Your data has been restored.");
      render();
    } catch (e) {
      showMsg("Restore failed", e.message);
    }
  };
  reader.readAsText(file);
}

/* ---------- Start ---------- */
function startApp() {
  var splash = document.getElementById("splash");
  setTimeout(function () {
    splash.className = "hide";
    setTimeout(function () {
      S.stage = setting("pin", "") ? "lock" : "welcome";
      renderStage();
    }, 500);
  }, 1800);
}
window.addEventListener("load", startApp);
</script>
