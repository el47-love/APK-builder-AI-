
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

            - name: Inspect Android manifest
        working-directory: android-project
        run: |
          echo "=== MANIFEST FILE ==="
          ls -l app/src/main/AndroidManifest.xml
          echo "=== MANIFEST CONTENTS ==="
          cat -A app/src/main/AndroidManifest.xml
          echo "=== XML VALIDATION ==="
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('XML is valid')"

      - name: Build debug APK
        working-directory: android-project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-builder-test
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
